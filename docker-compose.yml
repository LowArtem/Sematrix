services:
  postgres:
    image: pgvector/pgvector:pg16
    user: "0:0"
    environment:
      POSTGRES_DB: sematrix
      POSTGRES_USER: sematrix
      POSTGRES_PASSWORD: sematrix
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sematrix -d sematrix"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.11.10
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ./data/ollama:/root/.ollama

  ollama-init:
    image: ollama/ollama:0.11.10
    entrypoint: ["sh", "/scripts/ollama-init.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_INIT_MODELS: qwen3.5:9b bge-m3
    depends_on:
      ollama:
        condition: service_started
    restart: "no"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./scripts:/scripts:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://sematrix:sematrix@postgres:5432/sematrix
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data/assets:/data/assets
    ports:
      - target: 8000
        published: "8000"
        host_ip: 127.0.0.1

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://sematrix:sematrix@postgres:5432/sematrix
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data/assets:/data/assets

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://sematrix:sematrix@postgres:5432/sematrix
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data/assets:/data/assets

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - target: 80
        published: "8080"
        host_ip: 127.0.0.1
